server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /for-daria {
        return 301 /for-daria/;
    }

    location /for-daria/ {
        try_files $uri $uri/ /for-daria/index.html;
    }
}
